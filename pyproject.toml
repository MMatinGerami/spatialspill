[project]
name = "spatialspill"
version = "0.1.0"
description = "Calibrated estimation of cell-autonomous and spillover effects in spatial CRISPR screens"
readme = "README.md"
license = "MIT"
authors = [{ name = "Matin Gerami", email = "mmatin.gerami@gmail.com" }]
requires-python = ">=3.11,<3.12"
keywords = ["spatial transcriptomics", "CRISPR", "Perturb-seq", "causal inference", "interference"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pandas>=2.1",
    "anndata>=0.10",
    "mudata>=0.3",
    "scanpy>=1.10",
    "squidpy>=1.6",
    "statsmodels>=0.14,<0.15",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "h5py>=3.10",
    "requests>=2.31",
    "tqdm>=4.66",
    "networkx>=3.2",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "torch_geometric>=2.5"]
bayes = ["numpyro>=0.15", "jax>=0.4.30"]
pert = ["pertpy>=0.9"]
all = ["spatialspill[torch,bayes,pert]"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "hypothesis>=6.100",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "types-PyYAML",
    "types-requests",
    "pandas-stubs",
]

[project.urls]
Repository = "https://github.com/MMatinGerami/spatialspill"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "NPY", "RUF"]
ignore = ["E501", "RUF012", "B905"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src/spatialspill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=spatialspill --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
omit = ["src/spatialspill/_version.py"]
